[project]
name = "trading-engine"
version = "0.1.0"
description = "Automated trade-setup detector + statistics engine for DE30EUR M1 candles"
requires-python = ">=3.11"
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
